name: Verify v10.7-A.2.1 corrective Worker

on:
  push:
    branches:
      - fix/v10.7-a2-regression-p1
  pull_request:
    branches:
      - fix/v10.7-worker-source-of-truth
      - main

permissions:
  contents: read

jobs:
  verify-worker-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 24 for in-memory SQLite regression checks
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download exact raw incoming Worker and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='9f54ddd87f542e749cf0c070a292d7d56e11e0409895fc34d929740e4dbc21a7'
          RAW_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/a56ea76a8036e01deb2f3527e64bd3c7821b5503/incoming/worker-v10.7-A.2.txt"
          curl -fsSL --retry 3 --retry-delay 1 "$RAW_URL" -o /tmp/worker-v10.7-A.2.raw.txt
          ACTUAL="$(sha256sum /tmp/worker-v10.7-A.2.raw.txt | awk '{print $1}')"
          echo "raw_sha256=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          cmp -s /tmp/worker-v10.7-A.2.raw.txt incoming/worker-v10.7-A.2.txt
          grep -Fq "const CARESTEP_VERSION='10.7-A.2';" /tmp/worker-v10.7-A.2.raw.txt
          grep -Fq "const CARESTEP_BUILD='10.7-A.2';" /tmp/worker-v10.7-A.2.raw.txt

      - name: Exact diff summary against origin/main worker.txt
        shell: bash
        run: |
          set -euo pipefail
          git show 26395b304c94ea40a016c44b2e815da828e91c75:worker.txt > /tmp/main-worker.txt
          cp worker.txt /tmp/a2-worker.txt
          echo '--- byte counts ---'
          wc -c /tmp/main-worker.txt /tmp/a2-worker.txt
          echo '--- line counts ---'
          wc -l /tmp/main-worker.txt /tmp/a2-worker.txt
          echo '--- diff numstat ---'
          git diff --no-index --numstat -- /tmp/main-worker.txt /tmp/a2-worker.txt || true
          echo '--- diff stat ---'
          git diff --no-index --stat -- /tmp/main-worker.txt /tmp/a2-worker.txt || true
          echo '--- version lines ---'
          grep -n "CARESTEP_VERSION\|CARESTEP_BUILD\|EFSYNC_VERSION" /tmp/main-worker.txt | head -20 || true
          grep -n "CARESTEP_VERSION\|CARESTEP_BUILD\|EFSYNC_VERSION" /tmp/a2-worker.txt | head -20 || true

      - name: Function and schema regression inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          main = Path('/tmp/main-worker.txt').read_text(encoding='utf-8')
          a2 = Path('/tmp/a2-worker.txt').read_text(encoding='utf-8')
          fn_re = re.compile(r'(?m)^\s*(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(')
          table_re = re.compile(r'CREATE\s+TABLE\s+IF\s+NOT\s+EXISTS\s+([A-Za-z0-9_]+)', re.I)
          main_fn, a2_fn = set(fn_re.findall(main)), set(fn_re.findall(a2))
          removed_fn = sorted(main_fn - a2_fn)
          added_fn = sorted(a2_fn - main_fn)
          print(f'main_functions={len(main_fn)} a2_functions={len(a2_fn)}')
          print('removed_functions=' + (','.join(removed_fn) if removed_fn else '<none>'))
          print('added_functions=' + (','.join(added_fn) if added_fn else '<none>'))
          if removed_fn:
              raise SystemExit('Existing named functions were removed')
          main_tables, a2_tables = set(table_re.findall(main)), set(table_re.findall(a2))
          removed_tables = sorted(main_tables - a2_tables)
          added_tables = sorted(a2_tables - main_tables)
          print('removed_schema_tables=' + (','.join(removed_tables) if removed_tables else '<none>'))
          print('added_schema_tables=' + (','.join(added_tables) if added_tables else '<none>'))
          if removed_tables:
              raise SystemExit('Existing CREATE TABLE schema identifiers were removed')
          PY

      - name: Static regression markers
        shell: bash
        run: |
          set -euo pipefail
          F=worker.txt
          required=(
            'TOSS'
            'SOLAPI'
            'kakao_pf_id'
            'carestep-home'
            'HQ'
            'billing'
            'subscription'
            'password'
            'AES-GCM'
            'care_guardians'
            'care_patients'
            'care_patient_events'
            '/efriends/v1/health'
            '/efriends/v1/status'
            '/efriends/v1/runs'
            '/efriends/v1/sync-batch'
            '/efriends/v1/reconcile'
            '/efriends/v1/checkpoint'
            'retry'
            'dead_letter'
            'quarantine'
            'ledger'
            'clinic_id'
            'sourceEligibleVaccinations'
            'sourceEligibleHeartworm'
          )
          for marker in "${required[@]}"; do
            grep -Fqi -- "$marker" "$F" || { echo "MISSING marker: $marker"; exit 1; }
            echo "PASS marker: $marker"
          done

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          cp worker.txt /tmp/worker.mjs
          node --check /tmp/worker.mjs

      - name: Existing source verifier tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tools/verify-worker-source.test.mjs

      - name: Verify distinct corrective root Worker identity
        shell: bash
        run: |
          set -euo pipefail
          node tools/verify-worker-source.mjs

      - name: P1 behavioral regressions and migration idempotency (offline SQLite)
        shell: bash
        run: node --experimental-vm-modules tools/review-worker-candidate.mjs worker.txt
