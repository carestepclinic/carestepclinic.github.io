name: Apply v10.7-A.2.1 P1 corrective hotfix

on:
  push:
    branches:
      - fix/v10.7-a2-regression-p1
    paths:
      - tools/apply-worker-a2-1-hotfix.py
      - .github/workflows/apply-a2-p1-hotfix.yml

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore: stage A.2.1 corrective hotfix tooling' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v10.7-a2-regression-p1
          fetch-depth: 0
      - name: Apply deterministic source patch
        run: python3 tools/apply-worker-a2-1-hotfix.py
      - name: Syntax check
        run: |
          cp worker.txt /tmp/worker.mjs
          node --check /tmp/worker.mjs
          node --check tools/review-worker-candidate.mjs
      - name: Corrective behavioral regression
        env:
          CARESTEP_REVIEW_MODE: corrective
        run: node --experimental-vm-modules tools/review-worker-candidate.mjs worker.txt
      - name: Verify no destructive ledger operation
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq 'DROP[[:space:]]+(TABLE|INDEX)[[:space:]]+.*efriends_sync_ledger|DELETE[[:space:]]+FROM[[:space:]]+efriends_sync_ledger' worker.txt; then exit 1; fi
          git diff --check
      - name: Commit corrective candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name medisanimalhospital
          git config user.email medisah@naver.com
          git add worker.txt tools/review-worker-candidate.mjs tools/worker-a2-1.sha256 docs/worker-a2-1-corrective-hotfix.md
          git commit -m 'fix: correct A.2.1 P1 regressions'
          git push origin HEAD:fix/v10.7-a2-regression-p1
