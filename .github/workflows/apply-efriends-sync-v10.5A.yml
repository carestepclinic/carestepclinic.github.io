name: Apply eFriends Sync v10.5-A

on:
  push:
    branches:
      - feature/efriends-sync-v10.5-a
    paths:
      - .github/workflows/apply-efriends-sync-v10.5A.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/efriends-sync-v10.5-a
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch worker.txt
        env:
          EFSYNC_BLOCK_GZ_B64: ''
        run: |
          python - <<'PY'
          import os, gzip, base64
          from pathlib import Path

          worker_path = Path('worker.txt')
          text = worker_path.read_text(encoding='utf-8')
          block = gzip.decompress(base64.b64decode(os.environ['EFSYNC_BLOCK_GZ_B64'])).decode('utf-8')

          block_marker = '/* CARESTEP v10.5-A · eFriends Continuous Sync integration block'
          if block_marker not in text:
              anchor = '\nexport default {'
              if anchor not in text:
                  raise SystemExit('export default anchor not found')
              text = text.replace(anchor, '\n\n' + block.rstrip() + '\n\nexport default {', 1)

          route_marker = "if(url.pathname.startsWith('/efriends/v1/'))"
          if route_marker not in text:
              anchor = '    // v10.0-D.1 Carestep Home account, timeline, follow-up delivery, and Web Push routes.'
              if anchor not in text:
                  raise SystemExit('Carestep Home route anchor not found')
              route = "    // v10.5-A eFriends server Sync API. Uses dedicated server key, not a clinic user session.\n    if(url.pathname.startsWith('/efriends/v1/')) return handleEfriendsSyncRequest(request,env,url);\n\n"
              text = text.replace(anchor, route + anchor, 1)

          text = text.replace("const CARESTEP_VERSION='10.1-G';", "const CARESTEP_VERSION='10.5-A';", 1)
          worker_path.write_text(text, encoding='utf-8')
          PY
      - name: Syntax check
        run: |
          cp worker.txt /tmp/carestep-worker.mjs
          node --check /tmp/carestep-worker.mjs
          grep -q "handleEfriendsSyncRequest" worker.txt
          grep -q "'/efriends/v1/sync-batch'" worker.txt
      - name: Commit integrated worker on feature branch
        run: |
          if git diff --quiet -- worker.txt; then
            echo 'worker.txt already integrated'
            exit 0
          fi
          git config user.name 'CARESTEP Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add worker.txt
          git commit -m 'feat: integrate eFriends continuous sync API v10.5-A'
          git push origin HEAD:feature/efriends-sync-v10.5-a
