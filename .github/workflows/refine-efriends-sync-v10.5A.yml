name: Refine eFriends Sync v10.5-A

on:
  push:
    branches:
      - feature/efriends-sync-v10.5-a
    paths:
      - .github/workflows/refine-efriends-sync-v10.5A.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/efriends-sync-v10.5-a
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refine sync behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('worker.txt')
          text=p.read_text(encoding='utf-8')

          # 1) Keep manual Carestep Home visibility choices when an already-existing
          # imported event is refreshed. Only newly created eFriends events default hidden.
          start=text.index("  if(existing){", text.index("async function efSyncUpsertEvent"))
          end=text.index("  const id='pte_'", start)
          section=text[start:end]
          old="""    await env.DB.prepare(`INSERT INTO care_patient_event_home(event_id,clinic_id,patient_id,home_visible,home_note_cipher,updated_by,updated_at) VALUES(?1,?2,?3,0,'','efriends-sync',?4) ON CONFLICT(event_id) DO UPDATE SET home_visible=0,updated_by='efriends-sync',updated_at=excluded.updated_at`).bind(existing.id,cid,patientId,now).run();\n"""
          if old in section:
              section=section.replace(old,'',1)
              text=text[:start]+section+text[end:]

          # 2) Count already-mapped sync-created guardians as updates on later runs,
          # rather than inflating guardiansCreated on every reconcile.
          old_decl="  let map=await efSyncGetGuardianMap(env,cid,externalId),guardian=null,mode='reused';"
          new_decl="  let map=await efSyncGetGuardianMap(env,cid,externalId),guardian=null,mode='reused';const hadMap=!!map;"
          if old_decl in text:
              text=text.replace(old_decl,new_decl,1)

          old_ret="  return {externalId,id:guardian.id,mode};\n}\n\nasync function efSyncUpsertPatient"
          new_ret="  return {externalId,id:guardian.id,mode,action:hadMap?'updated':mode};\n}\n\nasync function efSyncUpsertPatient"
          if old_ret in text:
              text=text.replace(old_ret,new_ret,1)

          old_count="for(const r of guardians){try{const x=await efSyncUpsertGuardian(env,cid,r,now);if(x.mode==='created')out.guardiansCreated++;else out.guardiansReused++;}catch(e)"
          new_count="for(const r of guardians){try{const x=await efSyncUpsertGuardian(env,cid,r,now);if(x.action==='created')out.guardiansCreated++;else if(x.action==='updated')out.guardiansUpdated++;else out.guardiansReused++;}catch(e)"
          if old_count in text:
              text=text.replace(old_count,new_count,1)

          p.write_text(text,encoding='utf-8')
          PY
      - name: Verify refinements and syntax
        run: |
          cp worker.txt /tmp/carestep-worker.mjs
          node --check /tmp/carestep-worker.mjs
          python - <<'PY'
          from pathlib import Path
          t=Path('worker.txt').read_text(encoding='utf-8')
          s=t[t.index('async function efSyncUpsertEvent'):t.index('async function efSyncBatch')]
          pre=s[:s.index("  const id='pte_'")]
          assert "home_visible=0" not in pre, 'existing event update still resets Home visibility'
          assert "action:hadMap?'updated':mode" in t
          assert "x.action==='updated'" in t
          print('v10.5-A refinements verified')
          PY
      - name: Commit refinement
        run: |
          if git diff --quiet -- worker.txt; then
            echo 'No refinement changes required'
            exit 0
          fi
          git config user.name 'CARESTEP Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add worker.txt
          git commit -m 'fix: preserve imported event visibility and sync metrics'
          git push origin HEAD:feature/efriends-sync-v10.5-a
