<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>법정 동의서 · 합성 자료 검증</title><link rel="stylesheet" href="../clinic-support.css?v=20261120-statutory-consent"><style>@page{size:A4 portrait;margin:17mm 16mm}body{margin:0;background:#eee}nav{padding:16px;font:14px system-ui;display:flex;gap:12px;flex-wrap:wrap}button{padding:8px}main{max-width:178mm;padding:17mm 16mm;margin:auto;background:white}@media print{nav{display:none}main{max-width:none;padding:0}body{background:white}}</style><body class="su-print"><nav><b>합성 자료 · 실제 환자·서명이 아닙니다.</b><button id="short">수술 예시</button><button id="long">긴 설명 예시</button><button id="transfusion">수혈 예시</button><button id="print">인쇄·PDF 미리보기</button><output id="result"></output></nav><main id="preview"></main><script src="../surgery-consent-form.js?v=20261120-statutory-consent"></script><script>
const body={kind:'surgery',generalAnesthesia:true,title:'합성 수술',patientName:'합성 환자',species:'Canine',sex:'CM',chartNumber:'SYN-001',guardianName:'합성 보호자',guardianPhone:'010-0000-0000',guardianAddress:'합성 주소',relationship:'소유자',patientNotes:'합성 특이사항',hospitalName:'합성 동물병원',doctorName:'합성 수의사',licenseNumber:'TEST-001',hospitalPhone:'031-000-0000',hospitalAddress:'합성 병원 주소',diagnosis:'합성 진단명',necessity:'합성 수술 목적과 대안에 관한 설명입니다.',method:'합성 수술명·부위·좌우·범위 및 방법입니다.\n\n선택한 마취 계획: 전신마취\n마취 방법과 평가·관찰 계획에 관한 합성 설명입니다.',risks:'합성 수술 후유증과 부작용입니다.\n합성 마취 위험에 관한 설명입니다.',precautions:'합성 수술·마취 전후 보호자 준수사항입니다.',cost:'합성 예상 비용·변동 안내입니다.',plannedAt:'2026-11-22T10:00',signatures:{doctor:[[[.1,.5],[.3,.2],[.4,.7],[.7,.3]]],guardian:[[[.1,.6],[.4,.2],[.6,.8],[.8,.5]]]}};
const svg=strokes=>'<svg viewBox="0 0 600 160" aria-label="합성 서명">'+strokes.map(s=>'<polyline points="'+s.map(p=>p[0]*600+','+p[1]*160).join(' ')+'" fill="none" stroke="black" stroke-width="2"/>').join('')+'</svg>';
function show(mode){const b=structuredClone(body);if(mode==='long'){for(const k of ['method','risks','precautions'])b[k]+='\n'+Array.from({length:65},(_,i)=>(i+1)+'. 합성 장문 설명: 출력 시 각 문장과 마지막 내용이 잘리지 않는지 확인합니다.').join('\n')+'\n'+k+' 마지막 확인 문장';}if(mode==='transfusion'){b.kind='transfusion';b.title='합성 전신마취 수혈';b.method='합성 수혈 방법 및 마취 설명';}const html=SurgeryConsentForm.statutoryHTML({id:'SYNTHETIC-FORM-11',status:'signed',signedAt:'2026-11-20T15:30:00Z',retainUntil:'2027-11-20T15:30:00Z',hash:'SYNTHETIC-HASH',body:b},{stamp:s=>new Date(s).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}),svg,sources:''});document.querySelector('#preview').innerHTML=html;const content=document.querySelector('#preview').textContent;const ok=['diagnosis','necessity','method','risks','precautions','cost'].every(k=>content.includes(b[k]))&&document.querySelectorAll('.su-statutory-signature polyline').length===2&&content.includes('2026년 11월 21일');document.querySelector('#result').textContent=ok?'본문·서명·날짜 검증 통과':'검증 실패';}
for(const mode of ['short','long','transfusion'])document.getElementById(mode).onclick=()=>show(mode);document.querySelector('#print').onclick=()=>window.print();show('short');
</script></body></html>
