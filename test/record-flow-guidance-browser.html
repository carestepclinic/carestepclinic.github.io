<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>기록지 작성 안내 · 합성 검증</title><link rel="stylesheet" href="../clinic-calm.css"><link rel="stylesheet" href="../practice-tools.css"><link rel="stylesheet" href="../clinic-record-start.css"><link rel="stylesheet" href="../healthcheck-record.css"><link rel="stylesheet" href="../neuro-record.css"><link rel="stylesheet" href="../ophthalmic-record.css"><link rel="stylesheet" href="../chronic-record.css"><link rel="stylesheet" href="../dental-record.css"><link rel="stylesheet" href="../surgery-ledger.css"><link rel="stylesheet" href="../record-flow-guidance.css"><style>@font-face{font-family:Preview;src:url(../pretendard-variable-1.3.9.woff2)}body{margin:16px;background:#f6f7f4;font:16px Preview,sans-serif}*{box-sizing:border-box}button,input,select,textarea{font:inherit}#result{white-space:pre-wrap;overflow-wrap:anywhere}</style><body class="clinic-calm"><h2>기록지 작성 안내 · 합성 자료 검증</h2><button id="run">공통 안내 검증</button><button id="blood">혈액검사 회귀 검증</button><pre id="result"></pre><div id="practiceRoot"><main id="root"></main></div><script src="../clinic-record-start.js"></script><script src="../clinic-record-workspace.js"></script><script src="../record-input-choices.js"></script><script src="../healthcheck-record.js"></script><script src="../neuro-record.js"></script><script src="../ophthalmic-record.js"></script><script src="../chronic-record.js"></script><script src="../dental-record.js"></script><script src="../dental-workflow.js"></script><script src="../surgery-ledger.js"></script><script src="../record-flow-guidance.js"></script><script src="healthcheck-editing-browser.js"></script><script src="healthcheck-blood-tabs-browser.js"></script><script src="record-flow-guidance-browser.js"></script><script>window.qaErrors=[];addEventListener("error",e=>qaErrors.push(e.message));document.querySelector("#run").onclick=async()=>{document.querySelector("#result").textContent=
